name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: ragdesk
          POSTGRES_PASSWORD: ragdesk
          POSTGRES_DB: ragdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ragdesk:ragdesk@localhost:5432/ragdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

  migrations:
    # The models and the Alembic history must not drift apart.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: ragdesk
          POSTGRES_PASSWORD: ragdesk
          POSTGRES_DB: ragdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ragdesk:ragdesk@localhost:5432/ragdesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - name: Downgrade to base and back
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: [quality, test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ragdesk-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
